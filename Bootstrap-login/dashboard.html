<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PurpleInv</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --purple-dark: #2e1065;
            --purple-main: #7c3aed;
            --purple-light: #ddd6fe;
            --gray-dark: #1f2937;
            --gray-card: #111827;
            --text-white: #f9fafb;
        }
        body { background-color: var(--gray-dark); color: var(--text-white); font-family: 'Segoe UI', sans-serif; }
        
        /* Sidebar */
        #sidebar-wrapper { min-width: 250px; background-color: var(--purple-dark); color: white; min-height: 100vh; }
        .sidebar-heading { padding: 1.5rem; font-size: 1.5rem; font-weight: bold; color: var(--purple-light); text-transform: uppercase; letter-spacing: 1px; }
        .list-group-item { background-color: transparent; color: var(--purple-light); border: none; padding: 1rem 1.5rem; }
        .list-group-item:hover { background-color: var(--purple-main); color: white; }
        .list-group-item.active { background-color: var(--purple-main); color: white; font-weight: bold; }
        
        /* Content Area */
        #page-content-wrapper { flex-grow: 1; background-color: var(--gray-card); }
        .navbar { background-color: var(--purple-dark); border-bottom: 2px solid var(--purple-main); }
        .navbar-brand { color: var(--purple-light) !important; font-weight: bold; }
        
        /* Stats Display - Basic */
        .stats-display { 
            border-radius: 5px; 
            color: var(--text-white); 
            background-color: #1f2937; /* Slightly lighter gray */
            border: 1px solid #374151; 
            padding: 1rem;
            text-align: center;
        }
        .stats-title { font-size: 1rem; color: #a1a1aa; }
        .stats-value { font-size: 2rem; font-weight: bold; color: white; }
        
        /* Activity List - Simple */
        .activity-list { list-style: none; padding: 0; }
        .activity-item { 
            background-color: transparent;
            border-bottom: 1px solid #374151;
            padding: 10px;
            color: var(--text-white);
        }
        .activity-date { color: #6b7280; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="d-flex" id="wrapper">
        <div class="border-end" id="sidebar-wrapper">
            <div class="sidebar-heading border-bottom">INVENTORY</div>
            <div class="list-group list-group-flush">
                <a class="list-group-item list-group-item-action active" href="dashboard.html">📊 Dashboard</a>
                <a class="list-group-item list-group-item-action" href="items.html">📦 Items</a>
                <a class="list-group-item list-group-item-action" href="categories.html">🏷️ Categories</a>
                <a class="list-group-item list-group-item-action" href="units.html">📏 Units</a>
            </div>
        </div>
        
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-dark">
                <div class="container-fluid">
                    <span class="navbar-brand mb-0 h1">Dashboard</span>
                    <div class="d-flex align-items-center">
                        <a href="login.html" class="btn btn-outline-light btn-sm">Logout</a>
                    </div>
                </div>
            </nav>
            <div class="container-fluid p-3">
                
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <div class="stats-display">
                            <div class="stats-title">Items</div>
                            <div class="stats-value" id="totalItems">0</div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="stats-display">
                            <div class="stats-title">Categories</div>
                            <div class="stats-value" id="totalCategories">0</div>
                        </div>
                    </div>
                </div>

                <h5 class="text-white mb-2">Activity</h5>
                <ul class="activity-list" id="activityLog">
                    <li class="activity-item text-muted">No activity yet.</li>
                </ul>
                
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => { loadDashboardData(); });
        
        function loadDashboardData() {
            let items = JSON.parse(localStorage.getItem('inventoryItems')) || [];
            let cats = JSON.parse(localStorage.getItem('inventoryCategories')) || [];
            let activities = JSON.parse(localStorage.getItem('inventoryActivities')) || [];
            
            document.getElementById('totalItems').innerText = items.length;
            document.getElementById('totalCategories').innerText = cats.length;
            
            let logContainer = document.getElementById('activityLog');
            if (activities.length > 0) {
                logContainer.innerHTML = "";
                activities.slice(-5).reverse().forEach(act => {
                    logContainer.innerHTML += `
                        <li class="activity-item">
                            <span class="activity-date">${act.date}</span> - ${act.description}
                        </li>
                    `;
                });
            }
        }
    </script>
</body>
</html>
