<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items - PurpleInv</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --purple-dark: #2e1065;
            --purple-main: #7c3aed;
            --purple-light: #ddd6fe;
            --gray-dark: #1f2937;
            --gray-card: #111827;
            --text-white: #f9fafb;
        }
        body { background-color: var(--gray-dark); color: var(--text-white); font-family: 'Segoe UI', sans-serif; }
        
        #wrapper { display: flex; min-height: 100vh; }
        
        /* Sidebar */
        #sidebar-wrapper { min-width: 250px; background-color: var(--purple-dark); color: white; }
        .sidebar-heading { padding: 1.5rem; font-size: 1.5rem; font-weight: bold; color: var(--purple-light); text-transform: uppercase; letter-spacing: 1px; }
        .list-group-item { background-color: transparent; color: var(--purple-light); border: none; padding: 1rem 1.5rem; }
        .list-group-item:hover { background-color: var(--purple-main); color: white; }
        .list-group-item.active { background-color: var(--purple-main); color: white; font-weight: bold; }
        
        /* Content Area */
        #page-content-wrapper { flex-grow: 1; background-color: var(--gray-card); }
        .navbar { background-color: var(--purple-dark); border-bottom: 2px solid var(--purple-main); }
        .navbar-brand { color: var(--purple-light) !important; font-weight: bold; }
        
        /* Table Style */
        .table { color: var(--text-white) !important; background-color: var(--gray-dark); }
        .table-dark { background-color: var(--purple-dark) !important; color: var(--purple-light); }
        .table-bordered { border-color: #374151; }
        .low-stock { background-color: rgba(220, 53, 69, 0.3) !important; font-weight: bold; color: #fecaca !important; }
        
        /* Form & Modal */
        .form-control, .form-select { background-color: var(--gray-dark); border: 1px solid #374151; color: var(--text-white); }
        .form-control:focus, .form-select:focus { background-color: var(--gray-dark); color: var(--text-white); border-color: var(--purple-main); box-shadow: 0 0 0 0.25rem rgba(124, 58, 237, 0.25); }
        .modal-content { background-color: var(--gray-card); color: var(--text-white); border: 1px solid #374151; }
        .modal-header, .modal-footer { border-color: #374151; }
        
        /* Buttons */
        .btn-success { background-color: var(--purple-main); border-color: var(--purple-main); color: white; font-weight: bold; }
        .btn-success:hover { background-color: #6d28d9; border-color: #6d28d9; }
        .btn-primary { background-color: var(--purple-main); border-color: var(--purple-main); color: white; }
        .btn-primary:hover { background-color: #6d28d9; border-color: #6d28d9; }
    </style>
</head>
<body>
    <div class="d-flex" id="wrapper">
        <div class="border-end" id="sidebar-wrapper">
            <div class="sidebar-heading border-bottom">INVENTORY</div>
            <div class="list-group list-group-flush">
                <a class="list-group-item list-group-item-action" href="dashboard.html">📊 Dashboard</a>
                <a class="list-group-item list-group-item-action active" href="items.html">📦 Items</a>
                <a class="list-group-item list-group-item-action" href="categories.html">🏷️ Categories</a>
                <a class="list-group-item list-group-item-action" href="units.html">📏 Units</a>
            </div>
        </div>
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-dark">
                <div class="container-fluid">
                    <span class="navbar-brand mb-0 h1">Inventory Items</span>
                    <div class="d-flex align-items-center">
                        <span class="me-3 text-white">👤 Admin</span>
                        <a href="login.html" class="btn btn-outline-light btn-sm">Logout</a>
                    </div>
                </div>
            </nav>
            <div class="container-fluid p-4">
                <div class="row mb-3">
                    <div class="col-md-10">
                        <input type="text" class="form-control" id="searchInput" placeholder="Search items..." onkeyup="searchTable()">
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-success w-100" data-bs-toggle="modal" data-bs-target="#addItemModal" onclick="prepareModal()">Add Item</button>
                    </div>
                </div>
                <table class="table table-bordered shadow">
                    <thead class="table-dark">
                        <tr><th>ID</th><th>Name</th><th>Category</th><th>Unit</th><th>Qty</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="itemTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div class="modal fade" id="addItemModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content shadow-lg">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add New Item</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="itemForm">
                        <input type="hidden" id="editItemId">
                        <div class="mb-3"><label class="form-label">Item Name</label><input type="text" class="form-control" id="itemName" required></div>
                        <div class="mb-3"><label class="form-label">Category</label><select class="form-select" id="itemCategory"></select></div>
                        <div class="mb-3"><label class="form-label">Unit</label><select class="form-select" id="itemUnit"></select></div>
                        <div class="mb-3"><label class="form-label">Quantity</label><input type="number" class="form-control" id="itemQty" required></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="submitItemForm()">Save Item</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => { loadItems(); checkUrlForParams(); });
        function checkUrlForParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const category = urlParams.get('category');
            const search = urlParams.get('search');
            const filter = urlParams.get('filter');
            if (category) { document.getElementById('searchInput').value = category; searchTable(); } 
            else if (search) { document.getElementById('searchInput').value = search; searchTable(); }
            else if (filter === 'lowstock') {
                setTimeout(() => {
                    let rows = document.getElementById("itemTableBody").getElementsByTagName("tr");
                    for (let i = 0; i < rows.length; i++) {
                        rows[i].style.display = rows[i].classList.contains('low-stock') ? "" : "none";
                    }
                }, 100);
            }
        }
        function prepareModal() {
            document.getElementById('modalTitle').innerText = "Add New Item";
            document.getElementById('itemForm').reset();
            document.getElementById('editItemId').value = "";
            let cats = JSON.parse(localStorage.getItem('inventoryCategories')) || [];
            let units = JSON.parse(localStorage.getItem('inventoryUnits')) || [];
            let catSelect = document.getElementById('itemCategory');
            let unitSelect = document.getElementById('itemUnit');
            catSelect.innerHTML = cats.length === 0 ? "<option>No Categories Available</option>" : "";
            units.forEach(u => unitSelect.innerHTML += `<option value="${u.symbol}">${u.name} (${u.symbol})</option>`);
            cats.forEach(c => catSelect.innerHTML += `<option>${c.name}</option>`);
            const categoryFromUrl = new URLSearchParams(window.location.search).get('category');
            if (categoryFromUrl) catSelect.value = categoryFromUrl;
        }
        function searchTable() {
            let filter = document.getElementById("searchInput").value.toLowerCase();
            let rows = document.getElementById("itemTableBody").getElementsByTagName("tr");
            for (let i = 0; i < rows.length; i++) {
                rows[i].style.display = rows[i].textContent.toLowerCase().indexOf(filter) > -1 ? "" : "none";
            }
        }
        function submitItemForm() {
            let id = document.getElementById('editItemId').value;
            let name = document.getElementById('itemName').value;
            let cat = document.getElementById('itemCategory').value;
            let unit = document.getElementById('itemUnit').value;
            let qty = document.getElementById('itemQty').value;
            if(name && qty) {
                let items = JSON.parse(localStorage.getItem('inventoryItems')) || [];
                if (id) {
                    let index = items.findIndex(item => item.id == id);
                    items[index] = { id: parseInt(id), name, category: cat, unit, qty };
                    logActivity(`Updated item: ${name}`);
                } else {
                    items.push({ id: Date.now(), name, category: cat, unit, qty });
                    logActivity(`Added item: ${name}`);
                }
                localStorage.setItem('inventoryItems', JSON.stringify(items));
                bootstrap.Modal.getInstance(document.getElementById('addItemModal')).hide();
                loadItems();
                if(window.location.search) window.history.replaceState({}, document.title, window.location.pathname);
            } else alert("Please fill in all fields.");
        }
        function logActivity(description) {
            let activities = JSON.parse(localStorage.getItem('inventoryActivities')) || [];
            activities.push({ description: description, date: new Date().toLocaleString() });
            localStorage.setItem('inventoryActivities', JSON.stringify(activities));
        }
        function loadItems() {
            let items = JSON.parse(localStorage.getItem('inventoryItems')) || [];
            let tableBody = document.getElementById('itemTableBody');
            tableBody.innerHTML = "";
            items.forEach(item => {
                let isLowStock = parseInt(item.qty) <= 5;
                tableBody.innerHTML += `
                    <tr class="${isLowStock ? 'low-stock' : ''}">
                        <td>${item.id.toString().slice(-4)}</td>
                        <td>${item.name}</td>
                        <td>${item.category}</td>
                        <td>${item.unit}</td>
                        <td>${item.qty}</td>
                        <td>
                            <button class="btn btn-sm btn-warning" onclick="editItem(${item.id})">Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteItem(${item.id})">Delete</button>
                        </td>
                    </tr>
                `;
            });
            searchTable();
        }
        function editItem(id) {
            prepareModal(); 
            document.getElementById('modalTitle').innerText = "Edit Item";
            let item = (JSON.parse(localStorage.getItem('inventoryItems')) || []).find(item => item.id == id);
            if (item) {
                document.getElementById('editItemId').value = item.id;
                document.getElementById('itemName').value = item.name;
                document.getElementById('itemCategory').value = item.category;
                document.getElementById('itemUnit').value = item.unit;
                document.getElementById('itemQty').value = item.qty;
                new bootstrap.Modal(document.getElementById('addItemModal')).show();
            }
        }
        function deleteItem(id) {
            if(confirm("Are you sure you want to delete this item?")) {
                let items = JSON.parse(localStorage.getItem('inventoryItems')) || [];
                let itemToDelete = items.find(item => item.id == id);
                items = items.filter(item => item.id != id);
                localStorage.setItem('inventoryItems', JSON.stringify(items));
                logActivity(`Deleted item: ${itemToDelete.name}`);
                loadItems();
            }
        }
    </script>
</body>
</html>
