<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PurpleInv</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --purple-dark: #2e1065;
            --purple-main: #7c3aed;
            --purple-light: #ddd6fe;
            --gray-dark: #1f2937;
            --gray-card: #111827;
            --text-white: #f9fafb;
        }
        body { background-color: var(--gray-dark); color: var(--text-white); height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .login-card { background-color: var(--gray-card); padding: 2.5rem; border-radius: 15px; border: 1px solid #374151; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); width: 100%; max-width: 400px; }
        .brand-title { color: var(--purple-light); font-weight: bold; text-align: center; margin-bottom: 2rem; text-transform: uppercase; letter-spacing: 2px; }
        .form-label { color: var(--purple-light); font-weight: 500; }
        .form-control { background-color: var(--gray-dark); border: 1px solid #374151; color: var(--text-white); }
        .form-control:focus { background-color: var(--gray-dark); color: var(--text-white); border-color: var(--purple-main); box-shadow: 0 0 0 0.25rem rgba(124, 58, 237, 0.25); }
        .btn-purple { background-color: var(--purple-main); color: white; font-weight: bold; text-transform: uppercase; }
        .btn-purple:hover { background-color: #6d28d9; color: white; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 class="brand-title">INVENTORY LOGIN</h2>
        <form action="dashboard.html">
            <div class="mb-4">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" placeholder="Enter username" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-purple w-100">Sign In</button>
        </form>
    </div>
</body>
</html>
