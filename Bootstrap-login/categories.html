<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - PurpleInv</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --purple-dark: #2e1065;
            --purple-main: #7c3aed;
            --purple-light: #ddd6fe;
            --gray-dark: #1f2937;
            --gray-card: #111827;
            --text-white: #f9fafb;
        }
        body { background-color: var(--gray-dark); color: var(--text-white); font-family: 'Segoe UI', sans-serif; }
        
        #wrapper { display: flex; min-height: 100vh; }
        
        /* Sidebar */
        #sidebar-wrapper { min-width: 250px; background-color: var(--purple-dark); color: white; }
        .sidebar-heading { padding: 1.5rem; font-size: 1.5rem; font-weight: bold; color: var(--purple-light); text-transform: uppercase; letter-spacing: 1px; }
        .list-group-item { background-color: transparent; color: var(--purple-light); border: none; padding: 1rem 1.5rem; }
        .list-group-item:hover { background-color: var(--purple-main); color: white; }
        .list-group-item.active { background-color: var(--purple-main); color: white; font-weight: bold; }
        
        /* Content Area */
        #page-content-wrapper { flex-grow: 1; background-color: var(--gray-card); }
        .navbar { background-color: var(--purple-dark); border-bottom: 2px solid var(--purple-main); }
        .navbar-brand { color: var(--purple-light) !important; font-weight: bold; }
        
        /* Table Style */
        .table { color: var(--text-white) !important; background-color: var(--gray-dark); }
        .table-dark { background-color: var(--purple-dark) !important; color: var(--purple-light); }
        .table-bordered { border-color: #374151; }
        
        /* Form & Buttons */
        .form-control { background-color: var(--gray-dark); border: 1px solid #374151; color: var(--text-white); }
        .form-control:focus { background-color: var(--gray-dark); color: var(--text-white); border-color: var(--purple-main); box-shadow: 0 0 0 0.25rem rgba(124, 58, 237, 0.25); }
        .btn-success { background-color: var(--purple-main); border-color: var(--purple-main); color: white; font-weight: bold; }
        .btn-success:hover { background-color: #6d28d9; border-color: #6d28d9; }
        .btn-info { background-color: #4b5563; border-color: #4b5563; color: white; }
        .btn-info:hover { background-color: #6b7280; color: white; }
    </style>
</head>
<body>
    <div class="d-flex" id="wrapper">
        <div class="border-end" id="sidebar-wrapper">
            <div class="sidebar-heading border-bottom">INVENTORY</div>
            <div class="list-group list-group-flush">
                <a class="list-group-item list-group-item-action" href="dashboard.html">📊 Dashboard</a>
                <a class="list-group-item list-group-item-action" href="items.html">📦 Items</a>
                <a class="list-group-item list-group-item-action active" href="categories.html">🏷️ Categories</a>
                <a class="list-group-item list-group-item-action" href="units.html">📏 Units</a>
            </div>
        </div>
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-dark">
                <div class="container-fluid">
                    <span class="navbar-brand mb-0 h1">Categories</span>
                    <div class="d-flex align-items-center">
                        <span class="me-3 text-white">👤 Admin</span>
                        <a href="login.html" class="btn btn-outline-light btn-sm">Logout</a>
                    </div>
                </div>
            </nav>
            <div class="container-fluid p-4">
                <div class="row mb-3">
                    <div class="col-md-10">
                        <input type="text" class="form-control" id="searchInput" placeholder="Search categories..." onkeyup="searchCategories()">
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-success w-100" onclick="addCategory()">Add Category</button>
                    </div>
                </div>
                <table class="table table-bordered shadow">
                    <thead class="table-dark">
                        <tr><th>ID</th><th>Category Name</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="categoryTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", loadCategories);
        function logActivity(description) {
            let activities = JSON.parse(localStorage.getItem('inventoryActivities')) || [];
            activities.push({ description: description, date: new Date().toLocaleString() });
            localStorage.setItem('inventoryActivities', JSON.stringify(activities));
        }
        function getCategories() { return JSON.parse(localStorage.getItem('inventoryCategories')) || []; }
        function saveCategories(cats) { localStorage.setItem('inventoryCategories', JSON.stringify(cats)); }
        function loadCategories() {
            let cats = getCategories();
            let tableBody = document.getElementById('categoryTableBody');
            tableBody.innerHTML = "";
            cats.forEach((cat, index) => {
                tableBody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${cat.name}</td>
                        <td>
                            <button class="btn btn-sm btn-info text-white" onclick="manageCategory(${index})">Manage</button>
                            <button class="btn btn-sm btn-warning" onclick="editCategory(${index})">Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteCategory(${index})">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }
        function addCategory() {
            let catName = prompt("Enter Category Name:");
            if(catName) {
                let cats = getCategories();
                cats.push({ name: catName });
                saveCategories(cats);
                logActivity(`Added category: ${catName}`);
                loadCategories();
            }
        }
        function editCategory(index) {
            let cats = getCategories();
            let newName = prompt("Edit Category Name:", cats[index].name);
            if(newName) {
                let oldName = cats[index].name;
                cats[index].name = newName;
                saveCategories(cats);
                logActivity(`Edited category: ${oldName} to ${newName}`);
                loadCategories();
            }
        }
        function deleteCategory(index) {
            let cats = getCategories();
            if(confirm(`Are you sure you want to delete ${cats[index].name}?`)) {
                logActivity(`Deleted category: ${cats[index].name}`);
                cats.splice(index, 1);
                saveCategories(cats);
                loadCategories();
            }
        }
        function manageCategory(index) {
            window.location.href = `items.html?category=${encodeURIComponent(getCategories()[index].name)}`;
        }
        function searchCategories() {
            let filter = document.getElementById("searchInput").value.toLowerCase();
            let rows = document.getElementById("categoryTableBody").getElementsByTagName("tr");
            for (let i = 0; i < rows.length; i++) {
                rows[i].style.display = rows[i].textContent.toLowerCase().indexOf(filter) > -1 ? "" : "none";
            }
        }
    </script>
</body>
</html>
